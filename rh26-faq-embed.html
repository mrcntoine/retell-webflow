<style>
[data-rh26-component="FAQs"] .rh26-faq-item { overflow: hidden; }
[data-rh26-component="FAQs"] .rh26-faq-question { cursor: pointer; }
[data-rh26-component="FAQs"] .rh26-faq-plus { transition: transform .5s cubic-bezier(.22, 1, .36, 1); }
[data-rh26-component="FAQs"] .rh26-faq-item.is-open .rh26-faq-plus { transform: rotate(45deg); }
/* Show More / Show Less: the first 6 questions show; the rest wait behind the button (all show if scripts don't run) */
[data-rh26-component="FAQs"] .rh26-faq-list.is-collapsed > .rh26-faq-item:nth-child(n+7) { display: none; }
[data-rh26-component="FAQs"] .rh26-faq-list.is-collapsed > .rh26-faq-item:nth-child(6) { border-bottom-color: transparent; }
[data-rh26-component="FAQs"] .rh26-faq-more:not(.is-ready) { display: none; }
@media (prefers-reduced-motion: reduce) {
  [data-rh26-component="FAQs"] .rh26-faq-plus { transition: none; }
}
</style>
<script>
(function () {
  var EASE = 'cubic-bezier(.22, 1, .36, 1)', MS = 480, SHOWN = 6;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setup(item) {
    if (item.getAttribute('data-rh26-ready')) return;
    item.setAttribute('data-rh26-ready', 'true');
    var summary = item.querySelector('.rh26-faq-question');
    var answer = item.querySelector('.rh26-faq-answer');
    if (!summary || !answer) return;
    var anim = null, fade = null;
    if (item.open) item.classList.add('is-open');
    // The answer rests at its own (dimmed) opacity; the fade ends there so the text never flashes darker
    var restOpacity = parseFloat(getComputedStyle(answer).opacity);

    // Height the item has when only the question shows (keeps borders and padding)
    function closedHeight() {
      var cs = getComputedStyle(item);
      return summary.offsetHeight + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) +
        parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
    }
    // Stop whatever is running, keeping the values it had reached so a new animation starts from there
    function stop() {
      var state = { height: item.offsetHeight, opacity: parseFloat(getComputedStyle(answer).opacity) };
      if (anim) { anim.onfinish = null; anim.cancel(); anim = null; }
      if (fade) { fade.cancel(); fade = null; }
      return state;
    }

    summary.addEventListener('click', function (e) {
      e.preventDefault();
      var opening = !item.classList.contains('is-open');
      if (still) { stop(); item.open = opening; item.classList.toggle('is-open', opening); return; }
      var from = stop();
      var toH;
      if (opening) {
        item.classList.add('is-open');
        item.open = true;
        toH = item.offsetHeight; // measured with no animation running, so it is the real open height
        fade = answer.animate([{ opacity: Math.min(from.opacity, restOpacity), transform: 'translateY(-6px)' }, { opacity: restOpacity, transform: 'none' }], { duration: MS, easing: EASE });
      } else {
        item.classList.remove('is-open');
        toH = closedHeight();
        fade = answer.animate([{ opacity: from.opacity }, { opacity: 0 }], { duration: MS * 0.5, easing: 'ease-out', fill: 'forwards' });
      }
      anim = item.animate([{ height: from.height + 'px' }, { height: toH + 'px' }], { duration: MS, easing: EASE });
      anim.onfinish = function () {
        anim = null;
        if (!opening) item.open = false;
        if (fade) { fade.cancel(); fade = null; }
      };
    });
  }

  // Show More / Show Less: the list grows open while the remaining questions fade in one after another,
  // and closes back to the first 6 while they fade out. The button stays and swaps its label.
  function setupMore(root) {
    var list = root.querySelector('.rh26-faq-list');
    var wrap = root.querySelector('.rh26-faq-more');
    var btn = wrap && wrap.querySelector('[data-rh26-faq-more]');
    if (!list || !wrap || !btn || wrap.classList.contains('is-ready')) return;
    var items = Array.prototype.slice.call(list.querySelectorAll(':scope > .rh26-faq-item'));
    if (items.length <= SHOWN) { wrap.remove(); return; }
    if (!list.id) list.id = 'rh26-faq-list';
    list.classList.add('is-collapsed');
    wrap.classList.add('is-ready');
    btn.setAttribute('aria-controls', list.id);
    btn.setAttribute('aria-expanded', 'false');
    if (btn.tagName !== 'BUTTON') { btn.setAttribute('role', 'button'); btn.setAttribute('tabindex', '0'); }
    var extra = items.slice(SHOWN);
    var running = [], timer = null;

    // The page script wraps button text in .rh26-btn-label for the hover blur, so write into that when present
    function setLabel(text) { (btn.querySelector('.rh26-btn-label') || btn).textContent = text; }
    function settle() {
      clearTimeout(timer);
      running.forEach(function (a) { a.onfinish = null; a.cancel(); });
      running = [];
      list.style.overflow = '';
    }

    function toggle(e) {
      if (e) e.preventDefault();
      var opening = list.classList.contains('is-collapsed');
      settle();
      // Heights of both states, measured with nothing animating
      var h0, h1;
      if (opening) { h0 = list.offsetHeight; list.classList.remove('is-collapsed'); h1 = list.offsetHeight; }
      else { h1 = list.offsetHeight; list.classList.add('is-collapsed'); h0 = list.offsetHeight; list.classList.remove('is-collapsed'); }
      btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
      setLabel(opening ? 'Show Less' : 'Show More');

      var finish = function () {
        // The list is done; late fades of the last questions may still run, so only the clip and timer are cleared
        clearTimeout(timer);
        list.style.overflow = '';
        if (!opening) {
          list.classList.add('is-collapsed');
          // Keep the button in view after the list has closed above it
          var r = btn.getBoundingClientRect();
          if (r.top < 0 || r.bottom > innerHeight) btn.scrollIntoView({ block: 'center', behavior: still ? 'auto' : 'smooth' });
        }
      };
      if (still) return finish();

      list.style.overflow = 'hidden';
      running.push(list.animate([{ height: (opening ? h0 : h1) + 'px' }, { height: (opening ? h1 : h0) + 'px' }],
        { duration: MS + 120, easing: EASE }));
      extra.forEach(function (item, k) {
        running.push(opening
          ? item.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
              { duration: MS, easing: EASE, delay: Math.min(k, 8) * 30, fill: 'backwards' })
          : item.animate([{ opacity: 1 }, { opacity: 0 }], { duration: MS * 0.5, easing: 'ease-out', fill: 'forwards' }));
      });
      running[0].onfinish = finish;
      timer = setTimeout(finish, MS + 320); // in case the animation never finishes (e.g. a background tab)
    }
    btn.addEventListener('click', toggle);
    btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') toggle(e); });
  }

  function boot() {
    document.querySelectorAll('[data-rh26-component="FAQs"] .rh26-faq-item').forEach(setup);
    document.querySelectorAll('[data-rh26-component="FAQs"]').forEach(setupMore);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
