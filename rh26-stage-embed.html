<style>
/* [Retell] Conversational Dynamics: particle stage, model cards and architecture toggle (retell-particles-demo, Agent harness brief) */
[data-rh26-component="Conversational Dynamics"] .rh26-agent-visual { position: relative; }
[data-rh26-component="Conversational Dynamics"] .rh26-agent-visual > .rh26-art-wrap { transition: opacity .9s cubic-bezier(.2, .7, .2, 1); }
[data-rh26-component="Conversational Dynamics"] .rh26-agent-visual.is-live > .rh26-art-wrap { opacity: 0; }
.rh26-stage-canvas { position: absolute; inset: 0; z-index: 1; }
.rh26-stage-cards { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
.rh26-stage-frame { position: absolute; left: 0; top: 0; width: 876px; height: 678px; transform-origin: 0 0; }
.rh26-stage-col { position: absolute; left: 24px; top: 24px; width: 268px; animation: rh26-stage-float 6s ease-in-out infinite; }
.rh26-stage-below { display: none; }
.rh26-stage-is-mobile .rh26-stage-below { display: block; position: relative; }
[data-rh26-component="Conversational Dynamics"]:not(.rh26-stage-is-live) .rh26-stage-col,
[data-rh26-component="Conversational Dynamics"]:not(.rh26-stage-is-live) .rh26-stage-below { opacity: 0; }
.rh26-stage-col, .rh26-stage-below { transition: opacity .7s ease; }
/* one model's card (two for speech-to-speech's response controls); each tab's set rises in fresh */
.rh26-stage-set { display: flex; flex-direction: column; gap: 8px; animation: rh26-stage-card-in .7s .2s cubic-bezier(.2, .7, .2, 1) backwards; transition: opacity .45s ease, transform .45s ease, filter .45s ease; }
.rh26-stage-set.is-out { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; transform: translateY(-8px) scale(.98); filter: blur(4px); }
.rh26-stage-card {
  display: flex; gap: 12px; padding: 16px; border-radius: 20px;
  background-color: var(--_base-colors---white); color: var(--_base-colors---black);
  font-size: 14px; line-height: 19px; letter-spacing: -0.01em; text-align: left;
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .12), 0 3px 6px -1.5px rgba(0, 0, 0, .04), 0 12px 12px -6px rgba(0, 0, 0, .04), 0 48px 48px -24px rgba(0, 0, 0, .04);
}
.rh26-stage-card p { margin: 0; }
.rh26-stage-icon { display: block; flex: none; width: 20px; height: 20px; margin-top: 1px; background-color: #3e6aef; -webkit-mask: var(--icon) center / 20px 20px no-repeat; mask: var(--icon) center / 20px 20px no-repeat; }
.rh26-stage-card-body { flex: 1; min-width: 0; }
.rh26-stage-card-text { margin-top: 4px !important; font-size: 13px; line-height: 18px; color: rgba(0, 0, 0, .5); }
.rh26-stage-card-note { margin-top: 8px !important; font-size: 12px; line-height: 16px; color: rgba(0, 0, 0, .4); }
.rh26-stage-card-tag { display: inline-block; margin-top: 8px !important; padding: 2px 8px; border: 1px solid rgba(0, 0, 0, .15); border-radius: 100px; font-size: 11px; line-height: 14px; color: rgba(0, 0, 0, .5); }
/* the harness and its three components; each lights while it is called */
.rh26-stage-parts { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ebebf0; }
.rh26-stage-part { display: flex; gap: 10px; font-size: 13px; line-height: 17px; }
.rh26-stage-part-dot { position: relative; flex: none; width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background-color: rgba(0, 0, 0, .15); }
.rh26-stage-part-lit { position: absolute; inset: 0; border-radius: 50%; background-color: #3e6aef; opacity: var(--act); transform: scale(calc(1 + var(--act) * .3)); }
.rh26-stage-part-copy { min-width: 0; }
.rh26-stage-part-text { margin-top: 2px !important; font-size: 12px; line-height: 16px; color: rgba(0, 0, 0, .5); }
.rh26-stage-part-detail { margin-left: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: rgba(0, 0, 0, .3); }
/* architecture toggle: the pressed side is the white pill */
[data-rh26-component="Conversational Dynamics"] .rh26-arch-button[aria-pressed="true"] { opacity: 1; background-color: var(--_base-colors---white); box-shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 0 0 .5px rgba(0, 0, 0, .06); cursor: default; }
/* models: the playing one at full strength */
[data-rh26-component="Conversational Dynamics"] .rh26-scene-item[aria-current="step"] { opacity: 1; cursor: default; }
[data-rh26-component="Conversational Dynamics"] .rh26-scene-bar { transform: scaleY(0); }
/* The Listen icon is drawn in white for its active state; make it black like the others when not open */
[data-rh26-component="Conversational Dynamics"] [data-rh26-tab="0"][aria-selected="false"] .rh26-tab-number::before { filter: brightness(0); }
@keyframes rh26-stage-card-in { from { opacity: 0; transform: translateY(10px) scale(.97); filter: blur(4px); } }
@keyframes rh26-stage-float { 50% { transform: translateY(-5px); } }
@media (max-width: 767px) {
  .rh26-stage-col { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .rh26-stage-set, .rh26-stage-col { animation: none; }
}
</style>
<script>
// [Retell] Plain group switching, used only if the stage script can't load
window.rh26StageFallback = function () {
  var root = document.querySelector('[data-rh26-component="Conversational Dynamics"]');
  if (!root || root.hasAttribute('data-rh26-stage')) return;
  root.setAttribute('data-rh26-stage', 'fallback');
  var tabs = Array.prototype.slice.call(root.querySelectorAll('[data-rh26-tab]'));
  console.warn('[Retell] Conversational Dynamics: stage script unavailable, using plain groups');
  root.querySelectorAll('[data-rh26-arch]').forEach(function (b) { b.disabled = true; });
  function show(tab) {
    tabs.forEach(function (t) {
      var on = t === tab, panel = document.getElementById(t.getAttribute('aria-controls'));
      t.setAttribute('aria-selected', String(on));
      t.setAttribute('aria-expanded', String(on));
      if (panel) panel.hidden = !on;
    });
  }
  tabs.forEach(function (t) { t.addEventListener('click', function (e) { e.preventDefault(); show(t); }); });
  if (tabs[0]) show(tabs[0]);
};
</script>
<script type="module" src="https://cdn.jsdelivr.net/gh/mrcntoine/retell-webflow@e80c9460fd8b7e300c23a16e09cc27fbf1367da3/rh26-stage.js" onerror="window.rh26StageFallback()"></script>
