<!-- RH26 / Final CTA orbs: five orbs unfold from behind the centre photo, spin as WebGL spheres, then turn round the ring one place at a time.
     Ported from the Bakers reference (retell.bakers.studio/hero, "Unfold" defaults). Heading and buttons stay Designer elements:
     mark each with data-rh26-cta-tx so they fade up with the orbs. -->
<style>
.rh26-orbs{position:relative;width:100%;max-width:664px;margin:32px auto;height:258px}
.rh26-orbs-row{position:absolute;left:0;top:0;width:664px;height:258px;transform-origin:0 0}
.rh26-orbs-slot{position:absolute}
.rh26-orbs-fl,.rh26-orbs-fl>.rh26-orbs-orb{width:100%;height:100%}
/* the orb art is translucent and drawn for a white page: a white disc behind each keeps that look where orbs overlap */
.rh26-orbs-orb{position:relative;background:#fff;border-radius:50%;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0)}
.rh26-orbs-orb>img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;pointer-events:none;user-select:none}
.rh26-orbs-gl{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
.rh26-orbs-tint{position:absolute;inset:0;mix-blend-mode:color}
.rh26-cta-pending [data-rh26-cta-tx],.rh26-cta-pending .rh26-orbs-orb{opacity:0}
@media (max-width:767px){.rh26-orbs{margin:24px auto}}
</style>
<div class="rh26-orbs" data-rh26-orbs aria-hidden="true"><div class="rh26-orbs-row"></div></div>
<script>
(function(){
var LOG="[Retell]";
var host=document.currentScript&&document.currentScript.previousElementSibling;
if(!host||!host.hasAttribute("data-rh26-orbs"))host=document.querySelector("[data-rh26-orbs]");
if(!host||host.dataset.rh26Init)return;host.dataset.rh26Init="1";
var section=host.closest("section")||host.parentElement;
var row=host.querySelector(".rh26-orbs-row");

/* Webflow assets */
var ASSET={
  blue:"https://retell.bakers.studio/hero/assets/orb-blue.png",orange:"https://retell.bakers.studio/hero/assets/orb-orange.png",pink:"https://retell.bakers.studio/hero/assets/orb-pink.png",tex:"https://retell.bakers.studio/hero/assets/orb-pink-tex.png",
  photo:"https://retell.bakers.studio/hero/assets/photo.jpg",pBlue:"https://retell.bakers.studio/hero/assets/p-blue.jpg",pOrange:"https://retell.bakers.studio/hero/assets/p-orange.jpg",pPink:"https://retell.bakers.studio/hero/assets/p-pink.jpg",pTeal:"https://retell.bakers.studio/hero/assets/p-teal.jpg"
};
var TEX={blue:ASSET.blue,orange:ASSET.orange,pink:ASSET.pink,teal:ASSET.tex,green:ASSET.tex};
var TINT={teal:"#41dfc5",green:"#8fc93a"};
/* each orb opens into the photo of the person wearing its colour */
var PHOTOS={center:ASSET.photo,blue:ASSET.pBlue,orange:ASSET.pOrange,pink:ASSET.pPink,green:ASSET.pTeal};

/* "Unfold" settings from the reference */
var C={odelay:150,dur:950,stag:30,spread:100,s0:15,fade:30,rdelay:100,rdur:700,
  tdelay:0,t2:450,tdur:900,rise:12,tstag:80,sspd:20,sdelay:300,cdelay:2.5,chold:3,cdur:950};
var EASE="cubic-bezier(.33,1,.68,1)",SOFT="cubic-bezier(.22,1,.36,1)";
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
if(reduce){C.spread=0;C.s0=100;C.fade=100;C.rise=0}

/* ---------- build ---------- */
function img(src){var im=document.createElement("img");im.alt="";im.draggable=false;im.crossOrigin="anonymous";im.decoding="async";im.src=src;return im}
function orbEl(kind){
  var d=document.createElement("div");d.className="rh26-orbs-orb";
  d.appendChild(img(TEX[kind]));
  if(TINT[kind]){var t=document.createElement("i");t.className="rh26-orbs-tint";t.style.background=TINT[kind];t.dataset.c=TINT[kind];d.appendChild(t)}
  return d;
}
var SPECS=[
 {k:"orange",x:164,y:92,s:75,tex:"orange",z:0},
 {k:"pink",x:414,y:92,s:75,tex:"pink",z:0},
 {k:"center",x:203,y:0,s:258,z:1},
 {k:"blue",x:0,y:57,s:144,tex:"blue",z:2},
 {k:"green",x:520,y:57,s:144,tex:"teal",z:2}
];
var nodes={},CX=332,CY=129;
SPECS.forEach(function(sp){
  var slot=document.createElement("div");slot.className="rh26-orbs-slot";
  slot.style.cssText="left:"+sp.x+"px;top:"+sp.y+"px;width:"+sp.s+"px;height:"+sp.s+"px;z-index:"+sp.z;
  var fl=document.createElement("div");fl.className="rh26-orbs-fl";
  var orb;
  if(sp.k==="center"){
    orb=orbEl("green"); /* the photo's own orb, underneath it until the loop turns it round */
    var ph=img(ASSET.photo);orb.appendChild(ph);nodes.photo=ph;
  }else orb=orbEl(sp.tex);
  fl.appendChild(orb);slot.appendChild(fl);row.appendChild(slot);
  nodes[sp.k]={slot:slot,fl:fl,orb:orb,cx:sp.x+sp.s/2,cy:sp.y+sp.s/2,z:sp.z,s:sp.s};
});
var photoImg={};Object.keys(PHOTOS).forEach(function(k){var im=new Image();im.crossOrigin="anonymous";im.src=PHOTOS[k];photoImg[k]=im});

/* ---------- layout: the 664×258 row scales down to fit ---------- */
function layout(){var w=host.clientWidth||664,k=Math.min(1,w/664);row.style.transform=k<1?"scale("+k+")":"";host.style.height=(258*k)+"px"}
if(window.ResizeObserver)new ResizeObserver(layout).observe(host);else window.addEventListener("resize",layout);
layout();

/* ---------- WebGL sphere self-spin ----------
   Each orb texture is wrapped on a sphere turning round its vertical axis. The image splits into shading S (blur + radial
   limb profile, fixed to the screen) and pattern image/S, which moves with the surface. The back of each ball holds a photo. */
function orbShade(d,w,h){
  var N=64,M=256,NR=128,R=12,i,j,c,o,al,px,py,x,y,s,
    acc=new Float64Array(N*N*4),cn=new Float64Array(N*N),am=new Float64Array(M*M*4),cm=new Float64Array(M*M),gk=[];
  for(j=0;j<h;j++){py=(j+.5)/h*2-1;for(i=0;i<w;i++){px=(i+.5)/w*2-1;if(px*px+py*py>1)continue;
    o=(j*w+i)*4;al=d[o+3];var b=((j*N/h|0)*N+(i*N/w|0))*4,bm=((j*M/h|0)*M+(i*M/w|0))*4;
    for(c=0;c<4;c++){var v=c<3?Math.round(d[o+c]*al/255):al;acc[b+c]+=v;am[bm+c]+=v}cn[b/4]++;cm[bm/4]++}}
  for(i=-R;i<=R;i++)gk.push(Math.exp(-.5*i*i/16));
  function bl(a,st){var t=new Float64Array(a.length),u=new Float64Array(a.length),q,z;
    for(y=0;y<N;y++)for(x=0;x<N;x++)for(c=0;c<st;c++){s=0;for(q=-R;q<=R;q++){z=x+q;if(z>=0&&z<N)s+=a[(y*N+z)*st+c]*gk[q+R]}t[(y*N+x)*st+c]=s}
    for(y=0;y<N;y++)for(x=0;x<N;x++)for(c=0;c<st;c++){s=0;for(q=-R;q<=R;q++){z=y+q;if(z>=0&&z<N)s+=t[(z*N+x)*st+c]*gk[q+R]}u[(y*N+x)*st+c]=s}
    return u}
  var ba=bl(acc,4),bc=bl(cn,1),S=new Float64Array(N*N*4),SM=new Float64Array(M*M*4),i0=[],i1=[],fr=[],num=new Float64Array(NR*4),dn=new Float64Array(NR*4),Rb=new Float64Array(NR*4),rr=new Float64Array(M*M);
  for(i=0;i<N*N*4;i++)S[i]=ba[i]/Math.max(bc[i>>2],1e-9);
  for(i=0;i<M;i++){s=Math.min(N-1,Math.max(0,(i+.5)/M*N-.5));i0[i]=Math.floor(s);i1[i]=Math.min(i0[i]+1,N-1);fr[i]=s-i0[i]}
  for(y=0;y<M;y++)for(x=0;x<M;x++){o=(y*M+x)*4;rr[y*M+x]=Math.hypot((x+.5)/M*2-1,(y+.5)/M*2-1);var rb=Math.min(rr[y*M+x]*NR|0,NR-1)*4;
    for(c=0;c<4;c++){var t0=(i0[y]*N)*4+c,t1=(i1[y]*N)*4+c;
      SM[o+c]=(S[t0+i0[x]*4]*(1-fr[x])+S[t0+i1[x]*4]*fr[x])*(1-fr[y])+(S[t1+i0[x]*4]*(1-fr[x])+S[t1+i1[x]*4]*fr[x])*fr[y];
      if(cm[o>>2]>0){num[rb+c]+=am[o+c]/cm[o>>2];dn[rb+c]+=SM[o+c]}}}
  for(i=0;i<NR*4;i++)Rb[i]=dn[i]>0?num[i]/dn[i]:1;
  var hi=new Uint8Array(M*M*4),lo=new Uint8Array(M*M*4);
  for(y=0;y<M;y++)for(x=0;x<M;x++){s=Math.min(NR-1,Math.max(0,rr[y*M+x]*NR-.5));var r0=Math.floor(s),r1=Math.min(r0+1,NR-1),f=s-r0;
    for(c=0;c<4;c++){o=(y*M+x)*4+c;var q16=Math.min(65535,Math.max(0,Math.round(SM[o]*(Rb[r0*4+c]*(1-f)+Rb[r1*4+c]*f)/255*65535))),k=((M-1-y)*M+x)*4+c;hi[k]=q16>>8;lo[k]=q16&255}}
  return [hi,lo];
}
var FRAG="#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n"+
  "varying vec2 v;uniform sampler2D t,h,l,p;uniform float a,k,f;"+
  "vec4 S(vec2 p){p=p*.5+.5;return texture2D(h,p)*(65280./65535.)+texture2D(l,p)*(255./65535.);}"+
  "vec4 A(vec2 p){return texture2D(t,p*.5+.5)/max(S(p),vec4(1./4096.));}"+
  "vec2 V(float i){return i<.5?vec2(1.,1.):i<1.5?vec2(1.,-1.):vec2(-1.,1.);}"+
  "void main(){float r2=dot(v,v);if(r2>1.)discard;float z=sqrt(1.-r2),rho=sqrt(max(1.-v.y*v.y,1e-8)),b=a+f,c=cos(b),s=sin(b);"+
  "vec4 o=A(vec2(v.x*c+z*s,v.y));"+
  "if(k>0.){const float W=2.0943951;float u=(atan(v.x,z)+b)/W+.5,fi=floor(u),q=(u-fi-.5)*W,sg=q>0.?1.:-1.,i=mod(floor(mod(fi,3.)+.5),3.),n=mod(i+sg+3.,3.);"+
  "vec4 p=mix(A(V(i)*vec2(rho*sin(q),v.y)),A(V(n)*vec2(rho*sin(q-sg*W),v.y)),smoothstep(.8726646,1.2217305,abs(q)));"+
  "o=mix(p,o,(1.-k)*smoothstep(.55,.9,(z*c-v.x*s)/max(z,1e-4)));}"+
  "vec4 r=o*S(v);r.rgb=min(r.rgb,r.a);"+
  "if(f!=0.){float cf=cos(f),sf=sin(f),zp=v.x*sf-z*cf,xp=-(v.x*cf+z*sf),w=smoothstep(0.,.95,abs(abs(f)-3.14159265));"+
  "vec3 ph=texture2D(p,vec2(xp,v.y)*.5+.5).rgb*mix(1.,.72+.28*z,w*.85);r=mix(r,vec4(ph,1.),smoothstep(0.,.06,zp));}"+
  "gl_FragColor=clamp(r,0.,1.);}";
function glFor(n){
  if(n.gl!==undefined)return n.gl;
  n.gl=null;
  try{
    var im=n.orb.firstChild,cv=document.createElement("canvas"),px=Math.round(258*Math.min(2,window.devicePixelRatio||1)); /* every orb grows to the centre size in the loop */
    cv.width=cv.height=px;cv.className="rh26-orbs-gl";
    var gl=cv.getContext("webgl",{alpha:true,premultipliedAlpha:true,antialias:false});if(!gl)return null;
    function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
    var pr=gl.createProgram();
    gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 q;varying vec2 v;void main(){v=q;gl_Position=vec4(q,0.,1.);}"));
    gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;gl.useProgram(pr);
    var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var q=gl.getAttribLocation(pr,"q");gl.enableVertexAttribArray(q);gl.vertexAttribPointer(q,2,gl.FLOAT,false,0,0);
    var g={cv:cv,gl:gl,a:gl.getUniformLocation(pr,"a"),k:gl.getUniformLocation(pr,"k"),f:gl.getUniformLocation(pr,"f"),ready:false,img:im,phi:0};
    function tx(u,unit,w,h,data){var o=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,o);gl.uniform1i(gl.getUniformLocation(pr,u),unit);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,!data);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,!data);gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,data?gl.NONE:gl.BROWSER_DEFAULT_WEBGL);
      if(data)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,data);else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,w);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)}
    /* photo for the back of the ball, resized to the canvas first so the GPU draws it 1:1 */
    g.setPhoto=function(p){var oc=document.createElement("canvas"),x=oc.getContext("2d");oc.width=oc.height=px;x.imageSmoothingQuality="high";x.drawImage(p,0,0,px,px);tx("p",3,oc);g.photo=true};
    g.tint=n.orb.querySelector(".rh26-orbs-tint");
    function up(){try{var src=im,w=im.naturalWidth,h=im.naturalHeight,oc=document.createElement("canvas"),x=oc.getContext("2d");oc.width=w;oc.height=h;
      if(g.tint){x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);x.globalCompositeOperation="color";x.fillStyle=g.tint.dataset.c;x.fillRect(0,0,w,h);src=oc}
      else x.drawImage(im,0,0,w,h);
      var S=orbShade(x.getImageData(0,0,w,h).data,w,h);
      tx("t",0,src);tx("h",1,256,256,S[0]);tx("l",2,256,256,S[1]);gl.viewport(0,0,px,px);
      /* draw once now so shader linking and uploads don't land on the first animated frame */
      gl.uniform1f(g.a,0);gl.uniform1f(g.k,0);gl.uniform1f(g.f,0);gl.drawArrays(gl.TRIANGLES,0,3);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4));
      g.ready=true}catch(e){console.warn(LOG,"CTA orb texture could not be read; showing the flat image",e);g.ready=false}}
    if(im.complete&&im.naturalWidth)up();else im.addEventListener("load",up);
    im.after(cv);n.gl=g;return g;
  }catch(e){console.warn(LOG,"CTA orbs: WebGL unavailable",e);return null}
}

/* ---------- spin loop (drawn only while the section is on screen) ---------- */
var spinList=[],spinT0=0,spinRate=0,spinDelay=0,spinRaf=0,spinSign=-1,onScreen=false,spinning=false;
function moveEase(x){var lo=0,hi=1,t=x;for(var i=0;i<24;i++){t=(lo+hi)/2;var bx=3*(1-t)*(1-t)*t*.6+3*(1-t)*t*t*.2+t*t*t;if(bx<x)lo=t;else hi=t}return 3*(1-t)*t*t+t*t*t}
function spinTick(now){
  spinRaf=0;
  var ms=Math.max(0,now-spinT0-spinDelay),A=ms*spinRate/1000*Math.PI/180,a=spinSign*(A%(2*Math.PI)),ks=Math.min(1,A/(Math.PI/4)),kk=ks*ks*(3-2*ks);
  spinList.forEach(function(g){if(!g.ready)return;
    if(g.flip){var u=Math.min(1,(now-g.flip.t0)/g.flip.d),e=moveEase(u);g.phi=g.flip.a+(g.flip.b-g.flip.a)*e;if(u>=1){g.phi=g.flip.b%(2*Math.PI);g.flip=null}}
    var d0=Math.min(g.phi,2*Math.PI-g.phi)/(Math.PI/4),fk=d0>=1?1:d0*d0*(3-2*d0);
    g.gl.uniform1f(g.f,spinSign*g.phi);g.gl.uniform1f(g.a,a);g.gl.uniform1f(g.k,Math.max(kk,fk));g.gl.drawArrays(g.gl.TRIANGLES,0,3);
    if(!g.shown){g.shown=true;g.cv.style.display="block";g.img.style.visibility="hidden";if(g.tint)g.tint.style.display="none"}});
  if(onScreen)spinRaf=requestAnimationFrame(spinTick);
}
function resumeSpin(){if(spinning&&onScreen&&!spinRaf)spinRaf=requestAnimationFrame(spinTick)}
function startSpin(){
  if(reduce)return;
  spinList=[];
  SPECS.forEach(function(sp){var g=glFor(nodes[sp.k]);if(g){g.shown=false;spinList.push(g)}});
  if(!spinList.length)return;
  spinT0=performance.now();spinRate=C.sspd;spinDelay=C.sdelay;spinning=true;resumeSpin();
}

/* ---------- loop: the ring turns one place at a time ----------
   Seen from above the five balls sit on a ring. Each step the centre ball turns its orb face round, every ball moves one
   place and takes that place's size, and the ball reaching the centre turns its photo to the front. */
var RING=["center","blue","orange","pink","green"],cyc={t:0,gen:0};
var Z={center:5,green:4,pink:1,orange:0,blue:2}; /* counter-clockwise */
function flipTo(g,to,dur){g.flip={a:g.phi,b:to,t0:performance.now(),d:Math.max(1,dur)}}
function cycPrep(gen){
  return Promise.all(RING.map(function(k){var im=photoImg[k];return im.decode?im.decode().catch(function(){}):0})).then(function(){
    return RING.reduce(function(pr,k){return pr.then(function(){return new Promise(function(res){requestAnimationFrame(function(){
      var gl=nodes[k].gl;if(gen===cyc.gen&&gl&&gl.ready&&!gl.photo&&photoImg[k].naturalWidth){try{gl.setPhoto(photoImg[k])}catch(e){console.warn(LOG,"CTA orbs: photo texture failed",e)}}res()})})})},Promise.resolve());
  });
}
function cycBegin(ready){
  var gen=cyc.gen,at={},dur=C.cdur,front="center";
  RING.forEach(function(k,i){at[k]=i});
  function step(){
    if(gen!==cyc.gen)return;
    if(!onScreen){cyc.t=setTimeout(step,500);return} /* hold the ring while it is off screen */
    flipTo(nodes[front].gl,2*Math.PI,dur);
    RING.forEach(function(k){
      var i=at[k]=(at[k]-1+5)%5,n=nodes[k],d=nodes[RING[i]];if(!i)front=k;
      var to="translate3d("+(d.cx-n.cx).toFixed(2)+"px,"+(d.cy-n.cy).toFixed(2)+"px,0) scale("+(d.s/n.s).toFixed(5)+")";
      n.slot.style.zIndex=Z[RING[i]];
      var an=n.fl.animate([{transform:n.tf||"translate3d(0,0,0) scale(1)"},{transform:to}],{duration:dur,easing:"cubic-bezier(.6,0,.2,1)",fill:"forwards"});
      if(n.mv)n.mv.cancel();n.mv=an;n.tf=to;
    });
    flipTo(nodes[front].gl,Math.PI,dur);
    cyc.t=setTimeout(step,dur+C.chold*1000);
  }
  ready.then(function(){
    if(gen!==cyc.gen||!RING.every(function(k){var gl=nodes[k].gl;return gl&&gl.ready&&gl.photo}))return;
    SPECS.forEach(function(sp){var n=nodes[sp.k];n.slot.getAnimations().forEach(function(an){an.cancel()});n.slot.style.zIndex=Z[sp.k]});
    /* the centre photo is an image over its orb: turn the orb's back to the front underneath it, then take the image away */
    nodes.center.gl.phi=Math.PI;
    requestAnimationFrame(function(){requestAnimationFrame(function(){if(gen!==cyc.gen)return;nodes.photo.style.visibility="hidden";step()})});
  });
}

/* ---------- entrance ("Unfold") ---------- */
var IRIS=(function(){var N=48,S0=.08,ok=[],pk=[];
  for(var i=0;i<=N;i++){var q=1-i/N,sc=S0+(1-S0)*(1-q*q*q*q);
    ok.push({offset:i/N,opacity:i?1:0,transform:"scale("+sc.toFixed(5)+")"});
    pk.push({offset:i/N,transform:"scale("+(1/sc).toFixed(5)+")"})}
  return [ok,pk]})();
var ORDER={center:0,orange:0,pink:0,blue:1,green:1};
function play(){
  var end=0,f=Math.max(.01,C.fade/100),s0=C.s0/100;
  SPECS.forEach(function(sp){
    if(sp.k==="center")return;
    var n=nodes[sp.k],d=C.odelay+ORDER[sp.k]*C.stag,dx=(CX-n.cx)*C.spread/100,dy=(CY-n.cy)*C.spread/100;
    /* under the photo for the whole move, so each orb comes out from behind it */
    n.slot.animate([{zIndex:0},{zIndex:0}],{duration:1,fill:"both"});
    n.orb.animate([{opacity:0,transform:"translate3d("+dx.toFixed(2)+"px,"+dy.toFixed(2)+"px,0) scale("+s0+")",offset:0},{opacity:1,offset:f},{opacity:1,transform:"translate3d(0,0,0) scale(1)",offset:1}],{duration:C.dur,delay:d,easing:EASE,fill:"both"});
    end=Math.max(end,d+C.dur);
  });
  /* centre: the disc grows while the photo inside holds still (disc scales up, photo by the exact inverse) */
  var tm={duration:C.rdur,delay:C.rdelay,easing:"linear",fill:"both"};
  if(reduce){nodes.center.orb.animate([{opacity:0},{opacity:1}],{duration:C.rdur,delay:C.rdelay,easing:SOFT,fill:"both"})}
  else{nodes.photo.animate(IRIS[1],tm);nodes.center.orb.animate(IRIS[0],tm)}
  end=Math.max(end,C.rdelay+C.rdur);
  /* heading, then buttons */
  [].forEach.call(section.querySelectorAll("[data-rh26-cta-tx]"),function(el,i){
    var d=i?C.t2+(i-1)*C.tstag:C.tdelay;
    el.animate([{opacity:0,transform:"translate3d(0,"+C.rise+"px,0)"},{opacity:1,transform:"translate3d(0,0,0)"}],{duration:C.tdur,delay:d,easing:SOFT,fill:"both"});
    end=Math.max(end,d+C.tdur);
  });
  section.classList.remove("rh26-cta-pending");
  startSpin();
  if(!reduce){var gen=cyc.gen,ready=new Promise(function(res){setTimeout(function(){cycPrep(gen).then(res)},end+200)});
    cyc.t=setTimeout(function(){if(gen===cyc.gen)cycBegin(ready)},end+C.cdelay*1000)}
}

/* ---------- start when the section scrolls in ---------- */
section.classList.add("rh26-cta-pending");
var played=false;
function prime(){if(!reduce)SPECS.forEach(function(sp){glFor(nodes[sp.k])})} /* build the spheres before the entrance so it never stalls */
function go(){if(played)return;played=true;play()}
var imgs=[].slice.call(host.querySelectorAll("img"));
var loaded=Promise.all(imgs.map(function(i){return i.decode?i.decode().catch(function(){}):0}));
if(!("IntersectionObserver" in window)){onScreen=true;loaded.then(function(){prime();go()});return}
new IntersectionObserver(function(es){
  var e=es[0];onScreen=e.isIntersecting;
  if(onScreen){resumeSpin();if(!played)loaded.then(go)}
},{rootMargin:"0px 0px -15% 0px"}).observe(host);
new IntersectionObserver(function(es,io){if(es[0].isIntersecting){loaded.then(prime);io.disconnect()}},{rootMargin:"600px 0px"}).observe(host);
})();
</script>
