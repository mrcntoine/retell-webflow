    if (!replyLines[0] || !replyLines[1]) return;
    var spans = [];
    replyLines.forEach(function (line, k) {
      line.textContent = '';
      (lines[k] || '').split(' ').filter(Boolean).forEach(function (word, j) {
        if (j) line.appendChild(document.createTextNode(' '));
        var sp = document.createElement('span');
        sp.className = 'rh26-word';
        sp.textContent = word;
        line.appendChild(sp);
        spans.push(sp);
      });
    });
    spans.forEach(function (sp, k) { later(delay + 200 + k * WORD_MS, function () { sp.classList.add('is-said'); }); });
    return spans.length;
  }

  function go(i, instant) {
    i = (i + videos.length) % videos.length;
    if (i === current) return;
    var prev = videos[current], v = videos[i];
    current = i;
    swapTimers.forEach(clearTimeout); swapTimers = [];
    videos.forEach(function (el) { el.classList.toggle('is-active', el === v); });
    avatars.forEach(function (a, k) { a.classList.toggle('is-active', k === i); a.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
    if (avatars[i]) avatars[i].appendChild(ring);
    arc.style.strokeDashoffset = LEN;
    sArc.style.strokeDashoffset = SLEN;
    var orb = v.getAttribute('data-rh26-orb');
    if (orb) Array.prototype.forEach.call(orbs, function (img) { swapOrb(img, orb, instant); });
    applyAgent();
    swapBar(instant);
    updateSticky();

    // The conversation: the caller speaks, then the agent answers
    [bubble, reply].forEach(function (el) { if (el) el.classList.add('rh26-out'); });
    var agent = AGENTS[i] || {};
    if (agent.caller && agent.agent) {
      var callerText = agent.caller.join(' ');
      var t1 = 800;                                                          // caller bubble
      var t2 = t1 + Math.max(MIN_CALLER_MS, callerText.length * CALLER_MS);  // agent answers below
      var words = agent.agent.join(' ').split(' ').length;
      slideMs = t2 + 200 + (words - 1) * WORD_MS + 250 + END_MS;
      later(450, function () {
        setOverlay(v);
        if (bubbleText) bubbleText.textContent = agent.caller.join('\n');
        say(agent.agent, t2 - 450);
      });
      later(t1, function () { bubble && bubble.classList.remove('rh26-out'); });
      later(t2, function () { reply && reply.classList.remove('rh26-out'); });
    } else {
      slideMs = FALLBACK_MS;
      later(450, function () { setOverlay(v); bubble && bubble.classList.remove('rh26-out'); reply && reply.classList.remove('rh26-out'); });
    }

    // Warm up the next video, park the old one once it has faded out
    var after = videos[(i + 1) % videos.length];
    if (after.preload === 'none') after.preload = 'auto';
    if (prev) setTimeout(function () { if (prev !== videos[current]) { prev.pause(); prev.currentTime = 0; } }, 1300);
    play();
  }
  var next = function () { go(current + 1); };

  var panelTitle = root.querySelector('.rh26-panel-title');
  var panelCopy = root.querySelector('.rh26-panel-copy');
  var demoTitle = root.querySelector('.rh26-demo-title');
  var demoDesc = root.querySelector('.rh26-demo-desc');
  var submitBtn = root.querySelector('[data-rh26-call-form] [type="submit"]');
  var submitLabel = submitBtn && submitBtn.querySelector('span');
  var defaultLabel = submitLabel ? submitLabel.textContent : 'Get a call';
  var busy = false, barTimer = null;
  function applyAgent(label, copy) {
    var agent = AGENTS[current];
    if (!agent) return;
    if (panelTitle) panelTitle.textContent = 'Get a call from ' + agent.name;
    if (panelCopy) panelCopy.textContent = copy || agent.task;
    if (submitLabel) submitLabel.textContent = label || defaultLabel;
    var callLabel = callBtn && callBtn.querySelector('span');
    if (callLabel) callLabel.textContent = 'Get a call from ' + agent.name;
    // Phones show the call button as an icon only, so it keeps its name for screen readers
    if (callBtn) callBtn.setAttribute('aria-label', 'Get a call from ' + agent.name);
  }
  // Card under the video: the old text fades out, the new agent fades in
  function swapBar(instant) {
    var agent = AGENTS[current];
    if (!agent) return;
    var write = function () {
      if (demoTitle) demoTitle.textContent = agent.title;
      if (demoDesc) demoDesc.textContent = agent.desc;
      [demoTitle, demoDesc].forEach(function (el) { if (el) el.classList.remove('rh26-swap'); });
    };
    clearTimeout(barTimer);
    if (instant || reduceMotion) return write();
    [demoTitle, demoDesc].forEach(function (el) { if (el) el.classList.add('rh26-swap'); });
    barTimer = setTimeout(write, 350);
  }

  function playVideo() {
    var v = videos[current];
    if (v && seen && !reduceMotion && !document.hidden && hasSrc(v)) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
  }
  function play() {
    clearTimeout(timer);
    if (reduceMotion) return;
    playVideo();
    useTimer();
  }
  function pauseVideos() { videos.forEach(function (v) { v.pause(); }); }

  // Both rings fill over the slide's length, which follows its conversation
  (function tick() {
    if (videos[current] && !reduceMotion) {
      var p = startedAt && !calling ? Math.min(1, (performance.now() - startedAt) / slideMs) : 0;
      arc.style.strokeDashoffset = LEN * (1 - p);
      sArc.style.strokeDashoffset = SLEN * (1 - p);
    }
    requestAnimationFrame(tick);
  })();

  avatars.forEach(function (a, k) {
    var img = a.querySelector('img');
    a.setAttribute('role', 'button'); a.setAttribute('tabindex', '0');
    a.setAttribute('aria-label', 'Play demo: ' + (AGENTS[k] ? AGENTS[k].name + ', ' + AGENTS[k].title : (img && img.alt) || 'voice agent ' + (k + 1)));
    a.addEventListener('click', function () { go(k); trackDemo('Website Demo Selected', AGENTS[k]); });
    a.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(k); trackDemo('Website Demo Selected', AGENTS[k]); } });
  });

  // Video playback follows visibility; the slide timer does not, so the sticky call keeps in step
  new IntersectionObserver(function (entries) {
    seen = entries[0].isIntersecting;
    seen ? playVideo() : pauseVideos();
  }, { threshold: 0.25 }).observe(root);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearTimeout(timer); pauseVideos(); } else play();
  });

  /* ---------- Get a call panel ---------- */
  if (panel && callBtn) {
    var form = panel.querySelector('[data-rh26-call-form]');
    var closeBtn = panel.querySelector('[data-rh26-call-close]');
    var staggered = [closeBtn].concat(form ? Array.prototype.slice.call(form.children) : [], [panel.querySelector('.rh26-panel-legal')]);
    staggered.forEach(function (el, k) { if (el) el.style.setProperty('--rh26-d', (0.12 + k * 0.05) + 's'); });
    callBtn.setAttribute('role', 'button');
    callBtn.setAttribute('aria-haspopup', 'dialog');
    if (!callBtn.hasAttribute('href')) callBtn.setAttribute('tabindex', '0');

    var open = function (e) {
      if (e) e.preventDefault();
      if (!calling) trackDemo('Website Demo Opened', AGENTS[current]);
      calling = true;
      clearTimeout(timer);
      showSticky();
      root.classList.add('rh26-calling');
      panel.classList.add('is-open');
      panel.setAttribute('aria-modal', 'true');
      playVideo();
      setTimeout(function () { var f = panel.querySelector('input'); if (f) f.focus({ preventScroll: true }); }, 450);
    };
    openPanel = open;
    var close = function () {
      calling = false;
      root.classList.remove('rh26-calling');
      panel.classList.remove('is-open');
      panel.removeAttribute('aria-modal');
      if (!busy) applyAgent();
      callBtn.focus({ preventScroll: true });
      showSticky();
      useTimer();
    };
    callBtn.addEventListener('click', open);
    callBtn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') open(e); });
    if (closeBtn) closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && calling) close(); });

    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      var ok = true;
      Array.prototype.forEach.call(form.querySelectorAll('input'), function (input) {
        var valid = input.value.trim() !== '' && input.checkValidity();
        input.closest('.rh26-panel-field').classList.toggle('is-invalid', !valid);
        if (!valid && ok) { input.focus(); ok = false; }
      });
      if (!ok || busy) return;
      var digits = form.elements.phone.value.replace(/\D/g, '');
      if (digits.length === 11 && digits.charAt(0) === '1') digits = digits.slice(1);
      if (digits.length !== 10) {
        form.elements.phone.closest('.rh26-panel-field').classList.add('is-invalid');
        form.elements.phone.focus();
        return;
      }
      var agent = AGENTS[current];
      var detail = { phone: '+1' + digits, email: form.elements.email.value.trim(), demo: current + 1, agentId: agent.id, agent: agent.name };
      var requestProperties = {
        request_id: 'rh26-' + Date.now() + '-' + Math.random().toString(36).slice(2),
        phone: detail.phone,
        email: detail.email
      };
      trackDemo('Website Demo Call Requested', agent, requestProperties);
      root.dispatchEvent(new CustomEvent('rh26:get-a-call', { bubbles: true, detail: detail }));
      busy = true;
      submitBtn.disabled = true;
      submitBtn.setAttribute('aria-busy', 'true');
      applyAgent('Calling…');
      // A site-level handler can take over, otherwise the call goes straight to Retell
      var placeCall = typeof window.rh26GetACall === 'function'
        ? Promise.resolve(window.rh26GetACall(detail))
        : requestDemoCall(agent.id, detail.phone, detail.email);
      placeCall.then(function (call) {
        console.info('[Retell] Demo call created', call && call.call_id);
        trackDemo('Website Demo Call Succeeded', agent, Object.assign({}, requestProperties, { call_id: call && call.call_id || null }));
        applyAgent('Calling you now', agent.name + ' is calling you now. Pick up to start the demo.');
        form.reset();
      }).catch(function (err) {
        console.error('[Retell] Demo call failed', err);
        trackDemo('Website Demo Call Failed', agent, Object.assign({}, requestProperties, { error_message: String(err && err.message || 'Unknown error').slice(0,300) }));
        applyAgent('Try again', 'We couldn’t place the call. Check your number and try again.');
      }).then(function () {
        busy = false;
        submitBtn.disabled = false;
        submitBtn.removeAttribute('aria-busy');
      });
    });
  }

  go(0, true);
})();
</script>
